#
# Draft GitHub release for a plugin version, on the push of a tag x.y.z (no "v" prefix: Obsidian looks for the release
# whose tag equals manifest.json "version"). The maintainer reviews and publishes the draft by hand.
# Procedure: README, section "Releasing"; decisions: DECISIONS.md, phase P4.
name: release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

# Nothing by default; the only job gets what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: draft release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the token is only given to the release step
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Before anything else: the tag must equal manifest.json, package.json and versions.json
      - name: Check the tag against manifest.json, package.json and versions.json
        env:
          TAG: ${{ github.ref_name }}
        run: node version-bump.mjs check "$TAG"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "$TAG" \
            --notes "" \
            main.js manifest.json styles.css
