#
# Draft GitHub release for a plugin version, on the push of a tag x.y.z (no "v" prefix: Obsidian looks for the release
# whose tag equals manifest.json "version"). The maintainer reviews and publishes the draft by hand.
# Two jobs: "build" runs the repository code and npm with a read-only token; "release" holds the write and OIDC
# permissions and runs no repository code. Procedure: README, section "Releasing"; decisions: DECISIONS.md, phase P4.
name: release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

# Nothing by default; each job gets what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: check + build ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history and branches, for the check against origin/main
          persist-credentials: false
      # Only reviewed code is released: the tagged commit must already be in the history of main
      - name: Check that the tagged commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::error::Release $TAG refused: origin/main is missing from the checkout, the tagged commit cannot be checked."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release $TAG refused: the tagged commit $GITHUB_SHA is not in the history of main. Merge the release pull request first, then tag the merge commit on main (README, section Releasing)."
            exit 1
          fi
          echo "Release $TAG: commit $GITHUB_SHA is in the history of main."
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Before installing: the tag must equal manifest.json, package.json and versions.json
      - name: Check the tag against manifest.json, package.json and versions.json
        env:
          TAG: ${{ github.ref_name }}
        run: node version-bump.mjs check "$TAG"
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload the release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
          retention-days: 1

  release:
    name: draft release ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release and upload its assets
      id-token: write # OIDC token for the Sigstore signing certificate of the provenance attestation
      attestations: write # store the provenance attestation in the repository
    # No checkout, no npm, no repository code: only the files built by the "build" job
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets
      - name: Check the release assets
        working-directory: assets
        run: |
          missing=0
          for f in main.js manifest.json styles.css; do
            if [ ! -s "$f" ]; then
              echo "::error::Release asset $f is missing or empty in the build artifact."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          ls -l main.js manifest.json styles.css
          sha256sum main.js manifest.json styles.css
      # Signed SLSA build provenance of the release assets (recommended for the community directory)
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            assets/main.js
            assets/manifest.json
            assets/styles.css
      - name: Create the draft release
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "$TAG" \
            --generate-notes \
            main.js manifest.json styles.css
